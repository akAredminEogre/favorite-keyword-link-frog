# CoDD プロジェクト設定
version: "0.1.0"
codd_required_version: null
codd_required_version_strict: false

project:
  name: "frog-frame-front"
  language: "typescript"
  frameworks: []

# ai_command から危険フラグ（--permission-mode bypassPermissions /
# --dangerously-skip-permissions）を除去（殿裁可 cmd_2616 R1・2026-09-02＝
# 防御多重化によるnull化）。CLAUDE.md 使用規約は技術的強制力を持たぬため、
# 出所（upstream 既定）不問で設定側からも危険フラグを一切コミットしない。
# 本リポでは codd scaffold/generate/repair/extract --ai は使用禁止のため当
# コマンドは実行経路に乗らない（inert）が、万一 generate/repair が誤実行され
# ても危険フラグは発火しない（CLAUDE.md「codd 使用規約」参照）。
ai_command: "claude --print --model claude-opus-4-8 --effort max --tools \"\""

# codex_app_server:
