#         target: "session_action"
#         outcomes: [breakpoint_available, session_absence_after_action]
#       command: "npm run test:mobile-session-action"

scan:
  # 実レイアウト: リポ直下に package.json は無く、フロント実体は
  # host-frontend-root/frontend-src-root/ 配下（brownfield計装・cmd_2616）
  source_dirs:
    - "host-frontend-root/frontend-src-root/src/"
  test_dirs:
    - "host-frontend-root/frontend-src-root/tests/"
  doc_dirs:
    - "docs/"
  config_files: []
  exclude:
    - "**/node_modules/**"
    - "**/__pycache__/**"
    - "**/dist/**"
    - "**/worktrees/**"
    - "**/.wxt/**"
    - "**/.output/**"

graph:
  store: "jsonl"
  path: "codd/scan"

bands:
  green:
    min_confidence: 0.90
    min_evidence_count: 2
  amber:
    min_confidence: 0.50

propagation:
  max_depth: 10
  stop_at_contract_boundary: true

typecheck:
  enabled: false
  command: null
  max_repair_attempts: 3

verify:
  # install_preflight はリポ直下(cwd=project_root)で npm ci を打つが、
  # 本リポは直下に package.json が無いため必ず失敗する → 無効化し、
  # 依存導入は test_command 内の実体ディレクトリで行う前提とする
  install_preflight: false
  # 実テストコマンド（CI unit ジョブ相当: wxt prepare → vitest run）
  test_command: "cd host-frontend-root/frontend-src-root && npx wxt prepare && npm run test:unit"
  # 既定 docs/test/verify_report.md は不在dirへの docs/ 汚染となるため codd/ 配下へ
  report_output: "codd/reports/verify_report.md"

ci:
  provider: github_actions   # github_actions | gitlab_ci | none
  # GitHub Actions loads BOTH .yml and .yaml; the default spans both (comma-
  # separated union). Narrow to a single pattern to scope to one extension.
  workflow_glob: .github/workflows/*.yml
  required_triggers:
    - push
    - pull_request
  runtime_check: false       # opt-in (v2.13.0)
  staleness_days: 14
  # 本リポの PR/CI 基準ブランチは develop（main はリリース用）
  default_branch: develop

